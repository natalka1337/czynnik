<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Factor">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Factor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #16141C;
      color: #FFEDD5;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
      user-select: none;
    }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; }
    .title { font-size: 28px; font-weight: 900; color: #E84A27; letter-spacing: 1.5px; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: #2A2433; border: 1px solid #F59E0B; color: #FBBF24;
      padding: 8px; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .pdf-btn {
      background: #2A2433; border: 1px solid #F59E0B; color: #FBBF24;
      padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px;
    }
    .accent-line { height: 2px; background: #FACC15; margin-bottom: 14px; }
    .panel {
      background: #221E2B; padding: 14px; border-radius: 12px;
      border: 1px solid #3B2832; margin-bottom: 14px;
    }
    .row { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
    .col { width: 48%; }
    .col-full { width: 100%; margin-bottom: 10px; }
    label {
      display: block; font-size: 12px; font-weight: 700; color: #FBBF24;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    input {
      width: 100%; background: #16141C; border: 1px solid #4A323A;
      border-radius: 8px; padding: 10px; font-size: 14px; color: #FDE68A;
      outline: none; -webkit-appearance: none;
    }
    .btn-row { display: flex; gap: 10px; margin-top: 6px; }
    .save-btn {
      flex: 1; background: #E84A27; color: #FFF; border: none;
      padding: 12px; border-radius: 8px; font-weight: 800; font-size: 15px;
    }
    .save-btn.editing { background: #D97706; }
    .cancel-btn {
      background: #332C3F; color: #E2E8F0; border: none;
      padding: 12px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; display: none;
    }
    .card {
      background: #221E2B; padding: 12px; border-radius: 10px;
      border: 1px solid #3B2832; border-left: 4px solid #E84A27; margin-bottom: 8px;
    }
    .card.editing { border-color: #FACC15; border-left-color: #FACC15; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .card-date { font-size: 13px; color: #FDBA74; font-weight: 600; }
    .actions button { background: none; border: none; font-size: 13px; font-weight: 700; margin-left: 12px; }
    .edit-btn { color: #FACC15; }
    .del-btn { color: #F87171; }
    .card-details { display: flex; justify-content: space-between; align-items: center; }
    .badge {
      background: #16141C; border: 1px solid #4A323A; padding: 4px 8px;
      border-radius: 6px; font-size: 13px; font-weight: 700; color: #FBBF24;
    }
    .units { font-size: 17px; font-weight: 800; color: #FFEDD5; }
    .notes { margin-top: 6px; font-size: 13px; color: #D6D3D1; }
    .empty { text-align: center; color: #78716C; margin-top: 30px; font-size: 14px; }
    .sync-status { text-align: center; font-size: 11px; margin-top: -4px; margin-bottom: 10px; color: #9CA3AF; }

    #print-area { display: none; }
    @media print {
      body { background: #FFF; color: #16141C; padding: 0; }
      #app-ui { display: none; }
      #print-area { display: block; padding: 16px; }
      .p-title { font-size: 22px; color: #E84A27; text-transform: uppercase; margin-bottom: 4px; }
      .p-div { height: 2px; background: #F59E0B; margin-bottom: 12px; }
      .p-meta { font-size: 12px; color: #57534E; margin-bottom: 16px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { border: 1px solid #D6D3D1; padding: 8px 10px; text-align: left; }
      th { background: #221E2B !important; color: #FBBF24 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tr:nth-child(even) { background: #FAF8F5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .p-sum { margin-top: 16px; font-size: 13px; font-weight: bold; text-align: right; }
    }
  </style>
</head>
<body>
  <div id="app-ui">
    <div class="header">
      <div class="title">FACTOR</div>
      <div class="top-actions">
        <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
        <button class="pdf-btn" onclick="exportPDF()">Export PDF</button>
      </div>
    </div>
    <div class="accent-line"></div>

    <div id="settings-panel" class="panel" style="display: none;">
      <div class="col-full">
        <label>GitHub Token</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div class="col-full">
        <label>Repository</label>
        <input type="text" id="gh-repo" placeholder="username/repo">
      </div>
      <button class="save-btn" onclick="saveSettings()">Save Settings</button>
    </div>

    <div class="sync-status" id="sync-status"></div>

    <div class="panel">
      <div class="row">
        <div class="col">
          <label>Date</label>
          <input type="date" id="date">
        </div>
        <div class="col">
          <label>Batch Number</label>
          <input type="text" id="batch" autocapitalize="characters">
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>Units (IU)</label>
          <input type="number" id="units" inputmode="numeric">
        </div>
        <div class="col">
          <label>Notes</label>
          <input type="text" id="notes">
        </div>
      </div>
      <div class="btn-row">
        <button class="save-btn" id="saveBtn" onclick="saveEntry()">Save Entry</button>
        <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
      </div>
    </div>

    <div id="list"></div>
  </div>

  <div id="print-area">
    <h1 class="p-title">Factor Administration Log</h1>
    <div class="p-div"></div>
    <div class="p-meta" id="p-date"></div>
    <table>
      <thead>
        <tr>
          <th style="width:6%; text-align:center;">No.</th>
          <th style="width:20%;">Date</th>
          <th style="width:22%;">Batch Number</th>
          <th style="width:15%; text-align:right;">Units</th>
          <th style="width:37%;">Notes</th>
        </tr>
      </thead>
      <tbody id="p-body"></tbody>
    </table>
    <div class="p-sum" id="p-sum"></div>
  </div>

  <script>
    const STORAGE_KEY = '@factor_logs_v1';
    let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let editingId = null;

    const todayStr = () => new Date().toISOString().split('T')[0];
    document.getElementById('date').value = todayStr();
    if (entries.length > 0) document.getElementById('batch').value = entries[0].batchNumber;

    document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
    document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';

    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    function escapeHtml(t) {
      return String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function utf8ToBase64(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
      }));
    }

    function toggleSettings() {
      const panel = document.getElementById('settings-panel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function saveSettings() {
      localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
      toggleSettings();
      syncToGitHub();
    }

    function updateSyncStatus(msg, isError = false) {
      const status = document.getElementById('sync-status');
      status.textContent = msg;
      status.style.color = isError ? '#F87171' : '#9CA3AF';
    }

    async function syncToGitHub() {
      const token = localStorage.getItem('gh_token');
      const repo = localStorage.getItem('gh_repo');
      if (!token || !repo) {
        updateSyncStatus('GitHub sync not configured.');
        return;
      }

      updateSyncStatus('Syncing to GitHub...');
      const url = `https://api.github.com/repos/${repo}/contents/data.json`;
      const headers = { Authorization: `token ${token}`, 'Content-Type': 'application/json' };

      try {
        const getRes = await fetch(url, { headers });
        let sha = '';
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        } else if (getRes.status !== 404) {
          throw new Error('Failed to fetch file data.');
        }

        const contentStr = JSON.stringify(entries, null, 2);
        const contentBase64 = utf8ToBase64(contentStr);

        const putRes = await fetch(url, {
          method: 'PUT',
          headers,
          body: JSON.stringify({
            message: 'Update entries via App',
            content: contentBase64,
            sha: sha || undefined
          })
        });

        if (!putRes.ok) throw new Error('Failed to push data.');
        updateSyncStatus('Successfully synced to GitHub.');
      } catch (e) {
        updateSyncStatus('Sync failed: ' + e.message, true);
      }
    }

    function render() {
      const list = document.getElementById('list');
      if (entries.length === 0) {
        list.innerHTML = '<div class="empty">No entries recorded yet.</div>';
        return;
      }
      list.innerHTML = entries.map(item => `
        <div class="card ${editingId === item.id ? 'editing' : ''}">
          <div class="card-header">
            <span class="card-date">${escapeHtml(item.date)}</span>
            <div class="actions">
              <button class="edit-btn" onclick="startEdit('${item.id}')">Edit</button>
              <button class="del-btn" onclick="deleteEntry('${item.id}')">Delete</button>
            </div>
          </div>
          <div class="card-details">
            <span class="badge">Batch: ${escapeHtml(item.batchNumber)}</span>
            <span class="units">${escapeHtml(item.units)} IU</span>
          </div>
          ${item.notes ? `<div class="notes">${escapeHtml(item.notes)}</div>` : ''}
        </div>
      `).join('');
    }

    function saveEntry() {
      const date = document.getElementById('date').value;
      const batch = document.getElementById('batch').value.trim().toUpperCase();
      const units = parseInt(document.getElementById('units').value.trim(), 10);
      const notes = document.getElementById('notes').value.trim();

      if (!date || !batch || isNaN(units) || units <= 0) return;

      if (editingId) {
        entries = entries.map(e => e.id === editingId ? { ...e, date, batchNumber: batch, units, notes } : e);
        editingId = null;
      } else {
        entries.unshift({ id: Date.now().toString(), date, batchNumber: batch, units, notes });
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      cancelEdit();
      syncToGitHub();
    }

    function startEdit(id) {
      const item = entries.find(e => e.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById('date').value = item.date;
      document.getElementById('batch').value = item.batchNumber;
      document.getElementById('units').value = item.units;
      document.getElementById('notes').value = item.notes || '';
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = 'Update Entry';
      saveBtn.classList.add('editing');
      document.getElementById('cancelBtn').style.display = 'block';
      render();
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('date').value = todayStr();
      document.getElementById('units').value = '';
      document.getElementById('notes').value = '';
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = 'Save Entry';
      saveBtn.classList.remove('editing');
      document.getElementById('cancelBtn').style.display = 'none';
      render();
    }

    function deleteEntry(id) {
      entries = entries.filter(e => e.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      if (editingId === id) cancelEdit();
      else render();
      syncToGitHub();
    }

    function exportPDF() {
      if (entries.length === 0) return;
      const total = entries.reduce((s, i) => s + Number(i.units), 0);
      document.getElementById('p-date').textContent = 'Generated on: ' + todayStr();
      document.getElementById('p-body').innerHTML = entries.map((item, i) => `
        <tr>
          <td style="text-align:center;">${i + 1}</td>
          <td>${escapeHtml(item.date)}</td>
          <td><strong>${escapeHtml(item.batchNumber)}</strong></td>
          <td style="text-align:right;">${escapeHtml(item.units)} IU</td>
          <td>${escapeHtml(item.notes || '-')}</td>
        </tr>
      `).join('');
      document.getElementById('p-sum').textContent = `Total Entries: ${entries.length} | Total Factor Administered: ${total} IU`;
      window.print();
    }

    render();
    syncToGitHub();
  </script>
</body>
</html>
